name: release-notes

on:
  # Execute tooling from the trusted base, never from the PR branch. The only
  # write permission publishes the readiness status on the exact candidate head.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # GITHUB_TOKEN-authored PR events do not trigger other workflows. A maintainer
  # can request validation manually; the pre-tag gate always runs. A dispatch's
  # Actions check attaches to main, so explicitly publish the shared commit
  # status on the resolved PR head. Keep the Actions check name distinct.
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Release-please pull request number to validate"
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  not-a-release:
    name: non-release PR readiness
    # Reserved bot identities/branch names must never reach the N/A writer,
    # including malformed bot PRs that fail the strict release classification.
    if: >-
      ${{ github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release-please--branches--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish trusted not-applicable readiness for an ordinary PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          # Re-read immutable author/current head rather than trusting routing
          # alone. Never overwrite the bot's real gate with an N/A success.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e --arg sha "$CANDIDATE_SHA" '
            .state == "open" and .base.ref == "main" and .head.sha == $sha and
            (.user.login | type == "string") and .user.login != "github-actions[bot]" and
            (.head.ref | startswith("release-please--branches--") | not)' > /dev/null
          # Statuses are keyed by commit, not PR. An ordinary PR can share a bot
          # PR head, so check every open PR page before writing an N/A success.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" --jq '.[]' |
            jq -s -e --arg sha "$CANDIDATE_SHA" '
              [.[] | select(.head.sha == $sha and
                (.user.login == "github-actions[bot]" or
                 (.head.ref | startswith("release-please--branches--"))))] | length == 0' > /dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=success -f context='approved curated release notes' \
            -f description='Not a release PR; curated release notes are not applicable' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release-notes:
    name: validate curated release notes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.user.login == 'github-actions[bot]' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve a manually requested release-please candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.state == "open" and .base.ref == "main" and
              .user.login == "github-actions[bot]" and .head.repo.full_name == $repo and
              (.head.ref | startswith("release-please--branches--")) and
              (.base.sha | test("^[a-f0-9]{40}$")) and (.head.sha | test("^[a-f0-9]{40}$"))) |
            "base_sha=\(.base.sha)\nhead_sha=\(.head.sha)"' >> "$GITHUB_OUTPUT"
      - name: Check out trusted base tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || steps.candidate.outputs.base_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Check out release candidate as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.candidate.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mark the exact candidate head pending
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || steps.candidate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=pending -f context='approved curated release notes' \
            -f description='Validating approved notes for this exact release PR head' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Verify separately approved notes cover the complete candidate
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || steps.candidate.outputs.head_sha }}
        run: >-
          python3 tooling/tools/release/notes.py --repo candidate verify
          --ref "$CANDIDATE_SHA" --github-repository "$GITHUB_REPOSITORY"
      - name: Publish the exact candidate head readiness status
        if: ${{ always() && steps.pending.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || steps.candidate.outputs.head_sha }}
          NOTES_OUTCOME: ${{ steps.notes.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          state=failure
          description='Curated notes missing, stale, unapproved, or verification unavailable'
          if [ "$NOTES_OUTCOME" = "success" ]; then
            state=success
            description='Approved curated notes cover this exact release PR head'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state="$state" -f context='approved curated release notes' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
