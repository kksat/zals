name: release

# GitHub-only packaging: no PyPI, Homebrew tap, Marketplace, or Open VSX uploads.
# Every job checks out the tag, including when manually dispatched from main.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release on GitHub (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.15.1"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    name: validate release versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/release/verify.py versions --tag "$TAG"

  build:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            archive: tar.gz
          - target: aarch64-linux
            zig_target: aarch64-linux-musl
            archive: tar.gz
          - target: x86_64-macos
            zig_target: x86_64-macos.13.0
            archive: tar.gz
          - target: aarch64-macos
            zig_target: aarch64-macos.13.0
            archive: tar.gz
          - target: x86_64-windows
            zig_target: x86_64-windows
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: make zig ARGS="build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="zals-${version}-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp zig-out/bin/zals.exe dist/zals.exe
            (cd dist && zip -q "${name}.zip" zals.exe)
            rm dist/zals.exe
          else
            cp zig-out/bin/zals dist/zals
            tar -C dist -czf "dist/${name}.tar.gz" zals
            rm dist/zals
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  python:
    name: package python wheels
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Build wheels
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p wheelhouse
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          build_wheel() {
            local target="$1" plat="$2" archive="$3" bin
            rm -rf "$work/pkg" python/build python/src/*.egg-info
            mkdir -p "$work/pkg"
            if [ "$archive" = "zip" ]; then
              unzip -q "dist/zals-${version}-${target}.zip" -d "$work/pkg"
              bin="$work/pkg/zals.exe"
            else
              tar -xzf "dist/zals-${version}-${target}.tar.gz" -C "$work/pkg"
              bin="$work/pkg/zals"
            fi
            ZALS_BINARY="$bin" ZALS_PLATFORM_TAG="$plat" \
              python -m build --wheel --outdir wheelhouse python/
          }

          build_wheel x86_64-linux  manylinux_2_17_x86_64 tar.gz
          build_wheel aarch64-linux manylinux_2_17_aarch64 tar.gz
          build_wheel x86_64-macos  macosx_13_0_x86_64 tar.gz
          build_wheel aarch64-macos macosx_13_0_arm64 tar.gz
          build_wheel x86_64-windows win_amd64 zip
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  vscode:
    name: package vs code extensions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode
      - name: Test and typecheck extension
        run: |
          npm --prefix editors/vscode run typecheck
          npm --prefix editors/vscode test
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Build platform VSIX packages
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p vsix-packages
          output="$(pwd)/vsix-packages"

          package_vsix() {
            local target="$1" platform="$2" archive="$3"
            rm -rf editors/vscode/bin
            mkdir -p editors/vscode/bin
            if [ "$archive" = "zip" ]; then
              unzip -q "dist/zals-${version}-${target}.zip" -d editors/vscode/bin
            else
              tar -xzf "dist/zals-${version}-${target}.tar.gz" -C editors/vscode/bin
              chmod +x editors/vscode/bin/zals
            fi
            (
              cd editors/vscode
              npx --no-install vsce package --target "$platform" \
                --out "$output/zals-${version}-${platform}.vsix" --no-dependencies
            )
          }

          package_vsix x86_64-linux  linux-x64 tar.gz
          package_vsix aarch64-linux linux-arm64 tar.gz
          package_vsix x86_64-macos  darwin-x64 tar.gz
          package_vsix aarch64-macos darwin-arm64 tar.gz
          package_vsix x86_64-windows win32-x64 zip
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: vsix-packages/*.vsix
          if-no-files-found: error

  release:
    name: verify and publish github assets
    needs: [build, python, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify the complete asset set and bundled binaries
        run: python tools/release/verify.py assets --tag "$TAG" --directory dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip *.whl *.vsix > SHA256SUMS
      - name: Publish assets to GitHub only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
