name: release

# Called only after release-please creates a release, or manually dispatched.
# Manual packaging defaults to GitHub only; the caller selects external registries.
# Tagged sources/assets are used even when manually dispatched from main.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release-please tag to build and publish"
        required: true
        type: string
      publish_existing:
        description: "Publish existing GitHub assets without rebuilding or replacing them"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish verified wheels to PyPI using trusted publishing"
        type: boolean
        default: false
      publish_homebrew:
        description: "Publish the verified formula to kksat/tap"
        type: boolean
        default: false
      publish_vscode:
        description: "Publish verified VSIXs to Visual Studio Marketplace"
        type: boolean
        default: false
      vscode_auth:
        description: "Marketplace authentication: entra or pat"
        type: string
        default: entra
      publish_openvsx:
        description: "Publish verified VSIXs to Open VSX"
        type: boolean
        default: false
    secrets:
      VSCE_PAT:
        required: false
      OVSX_PAT:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release on GitHub (e.g. v0.1.0)"
        required: true
        type: string
      publish_existing:
        description: "Publish existing GitHub assets without rebuilding or replacing them"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish verified wheels to PyPI using trusted publishing"
        type: boolean
        default: false
      publish_homebrew:
        description: "Publish the verified formula to kksat/tap"
        type: boolean
        default: false
      publish_vscode:
        description: "Publish verified VSIXs to Visual Studio Marketplace"
        type: boolean
        default: false
      vscode_auth:
        description: "Marketplace authentication (Entra recommended; PAT uses VSCE_PAT)"
        type: choice
        default: entra
        options:
          - entra
          - pat
      publish_openvsx:
        description: "Publish verified VSIXs to Open VSX"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.15.1"
  TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: validate release versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/release/verify.py versions --tag "$TAG"

  build:
    name: build ${{ matrix.target }}
    if: ${{ !inputs.publish_existing }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            zig_target: x86_64-linux-musl
            archive: tar.gz
          - target: aarch64-linux
            zig_target: aarch64-linux-musl
            archive: tar.gz
          - target: x86_64-macos
            zig_target: x86_64-macos.13.0
            archive: tar.gz
          - target: aarch64-macos
            zig_target: aarch64-macos.13.0
            archive: tar.gz
          - target: x86_64-windows
            zig_target: x86_64-windows
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: make zig ARGS="build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="zals-${version}-${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp zig-out/bin/zals.exe dist/zals.exe
            (cd dist && zip -q "${name}.zip" zals.exe)
            rm dist/zals.exe
          else
            cp zig-out/bin/zals dist/zals
            tar -C dist -czf "dist/${name}.tar.gz" zals
            rm dist/zals
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  python:
    name: package python wheels
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Build wheels
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p wheelhouse
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          build_wheel() {
            local target="$1" plat="$2" archive="$3" bin
            rm -rf "$work/pkg" python/build python/src/*.egg-info
            mkdir -p "$work/pkg"
            if [ "$archive" = "zip" ]; then
              unzip -q "dist/zals-${version}-${target}.zip" -d "$work/pkg"
              bin="$work/pkg/zals.exe"
            else
              tar -xzf "dist/zals-${version}-${target}.tar.gz" -C "$work/pkg"
              bin="$work/pkg/zals"
            fi
            ZALS_BINARY="$bin" ZALS_PLATFORM_TAG="$plat" \
              python -m build --wheel --outdir wheelhouse python/
          }

          build_wheel x86_64-linux  manylinux_2_17_x86_64 tar.gz
          build_wheel aarch64-linux manylinux_2_17_aarch64 tar.gz
          build_wheel x86_64-macos  macosx_13_0_x86_64 tar.gz
          build_wheel aarch64-macos macosx_13_0_arm64 tar.gz
          build_wheel x86_64-windows win_amd64 zip
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  vscode:
    name: package vs code extensions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci --prefix editors/vscode
      - name: Test and typecheck extension
        run: |
          npm --prefix editors/vscode run typecheck
          npm --prefix editors/vscode test
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Build platform VSIX packages
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p vsix-packages
          output="$(pwd)/vsix-packages"

          package_vsix() {
            local target="$1" platform="$2" archive="$3"
            rm -rf editors/vscode/bin
            mkdir -p editors/vscode/bin
            if [ "$archive" = "zip" ]; then
              unzip -q "dist/zals-${version}-${target}.zip" -d editors/vscode/bin
            else
              tar -xzf "dist/zals-${version}-${target}.tar.gz" -C editors/vscode/bin
              chmod +x editors/vscode/bin/zals
            fi
            (
              cd editors/vscode
              npx --no-install vsce package --target "$platform" \
                --out "$output/zals-${version}-${platform}.vsix" --no-dependencies
            )
          }

          package_vsix x86_64-linux  linux-x64 tar.gz
          package_vsix aarch64-linux linux-arm64 tar.gz
          package_vsix x86_64-macos  darwin-x64 tar.gz
          package_vsix aarch64-macos darwin-arm64 tar.gz
          package_vsix x86_64-windows win32-x64 zip
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: vsix-packages/*.vsix
          if-no-files-found: error

  release:
    name: verify and publish github assets
    if: ${{ !inputs.publish_existing }}
    needs: [build, python, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify the complete asset set and bundled binaries
        run: python tools/release/verify.py assets --tag "$TAG" --directory dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip *.whl *.vsix > SHA256SUMS
      - name: Publish assets to GitHub only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  publication_assets:
    name: verify assets for external publication
    needs: [validate, release]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
          (needs.release.result == 'success' ||
           (inputs.publish_existing && needs.release.result == 'skipped')) &&
          (inputs.publish_pypi || inputs.publish_homebrew ||
           inputs.publish_vscode || inputs.publish_openvsx) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: Verify all packages and release checksums
        run: |
          python tools/release/verify.py assets --tag "$TAG" --directory dist
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-assets
          path: dist/*
          if-no-files-found: error

  vscode_marketplace:
    name: publish vs code marketplace
    needs: publication_assets
    if: ${{ !cancelled() && inputs.publish_vscode && inputs.vscode_auth != 'pat' && needs.publication_assets.result == 'success' }}
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      # Use the workflow revision's locked tools, even when publishing an older tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - uses: actions/download-artifact@v4
        with:
          name: verified-publication-assets
          path: dist
      - name: Require Marketplace identity configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo 'AZURE_CLIENT_ID is required'; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo 'AZURE_TENANT_ID is required'; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo 'AZURE_SUBSCRIPTION_ID is required'; exit 1; }
      - name: Sign in to Microsoft Entra ID using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish verified VSIXs to Visual Studio Marketplace
        working-directory: editors/vscode
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vsce publish --azure-credential --skip-duplicate \
            --packagePath ../../dist/zals-"${TAG#v}"-*.vsix

  vscode_marketplace_pat:
    name: publish vs code marketplace using pat
    needs: publication_assets
    if: ${{ !cancelled() && inputs.publish_vscode && inputs.vscode_auth == 'pat' && needs.publication_assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - uses: actions/download-artifact@v4
        with:
          name: verified-publication-assets
          path: dist
      - name: Require Marketplace PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT" || { echo 'VSCE_PAT is required'; exit 1; }
      - name: Publish verified VSIXs to Visual Studio Marketplace
        working-directory: editors/vscode
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          npx --no-install vsce publish --skip-duplicate \
            --packagePath ../../dist/zals-"${TAG#v}"-*.vsix

  openvsx:
    name: publish open vsx
    needs: publication_assets
    if: ${{ !cancelled() && inputs.publish_openvsx && needs.publication_assets.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --prefix editors/vscode
      - uses: actions/download-artifact@v4
        with:
          name: verified-publication-assets
          path: dist
      - name: Require Open VSX publishing credential
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: test -n "$OVSX_PAT" || { echo 'OVSX_PAT is required'; exit 1; }
      - name: Publish verified VSIXs to Open VSX
        working-directory: editors/vscode
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          npx --no-install ovsx publish --skip-duplicate \
            --packagePath ../../dist/zals-"${TAG#v}"-*.vsix

  pypi:
    name: publish python wheels to pypi
    needs: publication_assets
    if: ${{ !cancelled() && inputs.publish_pypi && needs.publication_assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Publishing helpers can repair metadata without moving a release tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: verified-publication-assets
          path: dist
      - name: Prepare and validate verified wheels for PyPI
        run: |
          python -m pip install trove-classifiers
          python tools/release/prepare_pypi.py --tag "$TAG" --source dist --output wheelhouse
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          skip-existing: true

  homebrew:
    name: publish homebrew tap formula
    needs: publication_assets
    if: ${{ !cancelled() && inputs.publish_homebrew && needs.publication_assets.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'kksat/homebrew-tap' }}
    steps:
      # The formula template can be repaired without changing an immutable tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-publication-assets
          path: dist
      - name: Require the tap publishing credential
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN" || { echo 'HOMEBREW_TAP_TOKEN is required'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render the formula from verified archives
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha() { sha256sum "dist/zals-${version}-$1.tar.gz" | awk '{print $1}'; }
          mkdir -p tap/Formula
          sed \
            -e "s/__VERSION__/${version}/g" \
            -e "s/__SHA256_X86_64_LINUX__/$(sha x86_64-linux)/g" \
            -e "s/__SHA256_AARCH64_LINUX__/$(sha aarch64-linux)/g" \
            -e "s/__SHA256_X86_64_MACOS__/$(sha x86_64-macos)/g" \
            -e "s/__SHA256_AARCH64_MACOS__/$(sha aarch64-macos)/g" \
            Formula/zals.rb > tap/Formula/zals.rb
          if grep -q '^[^#]*__[A-Z0-9_]*__' tap/Formula/zals.rb; then
            echo 'Unresolved formula placeholders' >&2
            exit 1
          fi
          ruby -c tap/Formula/zals.rb
      - name: Commit and push the formula
        working-directory: tap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/zals.rb
          if git diff --cached --quiet; then
            echo "Formula is already current"
            exit 0
          fi
          git commit -m "chore(zals): release ${TAG#v}"
          git push
