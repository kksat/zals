---
- name: Read a field by leaf name across unrelated receivers
  ansible.builtin.debug:
    msg: |-
      🛰 {{ record.field_name }} / {{ other['field_name'] }} / {{ spare["field_name"] }}
- name: Distinguish field reads from unqualified and qualified plugin names
  ansible.builtin.debug:
    msg: |-
      plain-filter {{ record.filter_field | filter_field }}
      plain-test {{ record.filter_field is filter_field }}
      qualified-filter {{ record.filter_field | acme.tools.filter_field }}
      qualified-test {{ record.filter_field is not acme.tools.filter_field }}
      middle-filter {{ record | acme.filter_field.apply }}
      middle-test {{ record is acme.filter_field.check }}
      filter-argument {{ record | acme.tools.apply(other.filter_field) }}
      test-argument {{ record is acme.tools.check(other['filter_field']) }}
- name: Distinguish called methods from stored fields
  ansible.builtin.debug:
    msg: |-
      stored {{ item.method_field }}
      dot-call {{ item.method_field() }}
      spaced-call {{ item.method_field (other.method_field) }}
      bracket-call {{ item['method_field']() }}
      double-call {{ item[ "method_field" ] () }}
      returned-field {{ item.invoke().method_field }}
      method-argument {{ item.invoke(other['method_field']) }}
- name: Strings and comments do not read fields
  ansible.builtin.debug:
    msg: |-
      genuine {{ record.literal_field }}
      single-string {{ 'record.literal_field' }}
      double-string {{ "record.literal_field" }}
      escaped-single {{ 'it\'s record.literal_field' }}
      escaped-double {{ "say \"record.literal_field\"" }}
      literal-list {{ ['literal_field', "literal_field"] }}
      literal-map {{ {'literal_field': "literal_field"} }}
      {# comment {{ record.literal_field }} #}
      outside record.literal_field
    # YAML comment {{ record.literal_field }}
- name: Fields work in bare expressions and template statements
  ansible.builtin.debug:
    msg: |-
      interpolation {{ receiver.context_field }}
      🛰 {% if receiver['context_field'] %}enabled{% endif %}
      {% set selected = receiver [ "context_field" ] %}
  when:
    - receiver['context_field'] == 'active'
    - receiver.context_field is defined
- name: Root Variables stay separate from same-named fields
  ansible.builtin.debug:
    msg: |-
      root-read {{ field_name }}
      dynamic-subscript {{ record[field_name] }}
      numeric {{ record[0] }} / {{ record[42] }} / {{ record[-1] }} / {{ record[1.0] }}
      computed-single {{ record['field_name' ~ suffix] }}
      computed-double {{ record["field_name" + suffix] }}
  when: record[field_name] is defined
