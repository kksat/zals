---
- name: Read a field by leaf name across unrelated receivers
  ansible.builtin.debug:
    msg: |-
      🛰 {{ record.field_name }} / {{ other['field_name'] }} / {{ spare["field_name"] }}
- name: Distinguish field reads from unqualified and qualified plugin names
  ansible.builtin.debug:
    msg: |-
      plain-filter {{ record.filter_field | filter_field }}
      plain-test {{ record.filter_field is filter_field }}
      qualified-filter {{ record.filter_field | acme.tools.filter_field }}
      qualified-test {{ record.filter_field is not acme.tools.filter_field }}
      middle-filter {{ record | acme.filter_field.apply }}
      middle-test {{ record is acme.filter_field.check }}
      filter-argument {{ record | acme.tools.apply(other.filter_field) }}
      test-argument {{ record is acme.tools.check(other['filter_field']) }}
- name: Distinguish called methods from stored fields
  ansible.builtin.debug:
    msg: |-
      stored {{ item.method_field }}
      dot-call {{ item.method_field() }}
      spaced-call {{ item.method_field (other.method_field) }}
      bracket-call {{ item['method_field']() }}
      double-call {{ item[ "method_field" ] () }}
      returned-field {{ item.invoke().method_field }}
      method-argument {{ item.invoke(other['method_field']) }}
- name: Strings and comments do not read fields
  ansible.builtin.debug:
    msg: |-
      genuine {{ record.literal_field }}
      single-string {{ 'record.literal_field' }}
      double-string {{ "record.literal_field" }}
      escaped-single {{ 'it\'s record.literal_field' }}
      escaped-double {{ "say \"record.literal_field\"" }}
      literal-list {{ ['literal_field', "literal_field"] }}
      literal-map {{ {'literal_field': "literal_field"} }}
      {# comment {{ record.literal_field }} #}
      outside record.literal_field
    # YAML comment {{ record.literal_field }}
- name: Fields work in bare expressions and template statements
  ansible.builtin.debug:
    msg: |-
      interpolation {{ receiver.context_field }}
      🛰 {% if receiver['context_field'] %}enabled{% endif %}
      {% set selected = receiver [ "context_field" ] %}
  when:
    - receiver['context_field'] == 'active'
    - receiver.context_field is defined
- name: Root Variables stay separate from same-named fields
  ansible.builtin.debug:
    msg: |-
      root-read {{ field_name }}
      dynamic-subscript {{ record[field_name] }}
      numeric {{ record[0] }} / {{ record[42] }} / {{ record[-1] }} / {{ record[1.0] }}
      computed-single {{ record['field_name' ~ suffix] }}
      computed-double {{ record["field_name" + suffix] }}
  when: record[field_name] is defined
- name: Template filter blocks also distinguish plugin names from field reads
  ansible.builtin.debug:
    msg: |-
      genuine-block {{ receiver.block_field }}
      plain-block {% filter block_field %}text{% endfilter %}
      qualified-block {% filter acme.tools.block_field %}text{% endfilter %}
      argument-block {% filter acme.tools.apply(other['block_field']) %}text{% endfilter %}
- name: Keyword-like data members are ordinary fields, not plugin names
  ansible.builtin.debug:
    msg: |-
      filter-member {{ data.filter }} / {{ data['filter'] }} / {{ data["filter"] }}
      filter-condition {% if data.filter %}yes{% endif %}
      is-member {{ data.is }} / {{ data['is'] }} / {{ data["is"] }}
      is-statement {% set saved = data.is %}
      true-member {{ data.true }} / {{ data['true'] }} / {{ data["true"] }}
      filter-operator {{ data | filter }}
      qualified-filter-operator {{ data | acme.is.filter }}
      test-operator {{ data is true }}
      qualified-test-operator {{ data is not acme.filter.true }}
      keyword-filter-block {% filter filter %}text{% endfilter %}
      trimmed-filter-block {%- filter acme.is.filter -%}text{% endfilter %}
      keyword-method {{ data.filter() }}
      conditional-member {{ data | lower if enabled else other.filter }}
  when: data.true
- name: Quoted delimiters are literal contents, not the end of an expression
  ansible.builtin.debug:
    msg: |-
      🛰 quoted-interpolation {{ '}} {{ phantom.delimiter_field }} {{ ghost_root }}' ~ actual.delimiter_field }}
      quoted-statement {% set saved_value = "say \"%}\" {% set bogus = phantom.delimiter_field %} {{ ghost_root }}" ~ actual.delimiter_field %}
      {# literal-comment "{{ phantom.delimiter_field }} {{ ghost_root }} %}" #}
- name: Single-quoted YAML interpolation keeps Jinja string boundaries
  ansible.builtin.debug:
    msg: 'quoted-yaml {{ "}} {{ phantom.delimiter_field }} {{ ghost_root }}" ~ actual.delimiter_field }}'
- name: Single-quoted YAML statement keeps Jinja string boundaries
  ansible.builtin.debug:
    msg: 'statement-yaml {% set saved_value = "%} {% set bogus = phantom.delimiter_field %} {{ ghost_root }}" ~ actual.delimiter_field %}'
- name: Incomplete interpolation still scans the remaining body
  ansible.builtin.debug:
    msg: 'unterminated-interpolation {{ actual.fallback_field'
- name: Incomplete statement still scans the remaining body
  ansible.builtin.debug:
    msg: 'unterminated-statement {% if actual.fallback_field'
- name: YAML single-quoted scalars decode doubled quotes before Jinja scanning
  ansible.builtin.debug:
    msg: '🛰 yaml-single {{ object[''yaml_field''] }}'
  when: 'object[''yaml_field''] == ''single-active'''
- name: YAML double-quoted scalars decode escapes before Jinja scanning
  ansible.builtin.debug:
    msg: "🛰 yaml-double {{ object[\"yaml_field\"] }}"
  when: "object[\"yaml_field\"] == \"double-active\""
- name: Quoted YAML template statements also decode their field literals
  ansible.builtin.debug:
    single: 'yaml-single-statement {% if object[''yaml_field''] %}yes{% endif %}'
    double: "yaml-double-statement {% if object[\"yaml_field\"] %}yes{% endif %}"
- name: YAML escapes preserve their original source coordinates
  ansible.builtin.debug:
    msg: "🛰 \U0001F6F0 yaml-unicode {{ object[\"\u0079aml_field\"] }}"
- name: Existing unquoted and block scalar forms keep original coordinates
  ansible.builtin.debug:
    plain: yaml-plain {{ object.yaml_field }}
    literal: |-
      🛰 yaml-literal {{ object['yaml_field'] }}
    folded: >-
      yaml-folded {{ object["yaml_field"] }}
- name: Quoted YAML dynamic subscripts stay in the root Variable group
  ansible.builtin.debug:
    single: '🛰 yaml-dynamic-single {{ object[yaml_field] }}'
    double: "🛰 yaml-dynamic-double {{ object[yaml_field] }}"
    escaped: "yaml-root-escape {{ \u0079aml_field }}"
  when: "object[yaml_field] == \"dynamic-active\""
- name: YAML normalization does not decode Jinja literal-key escapes
  ansible.builtin.debug:
    msg: "yaml-jinja-escape {{ object['\\u0079aml_field'] }}"
