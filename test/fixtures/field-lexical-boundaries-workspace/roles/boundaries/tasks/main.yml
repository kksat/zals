      quoted {{ "{% raw %}{{ dummy.boundary_field }}" ~ data.boundary_field }}
      preserved-raw {%+ raw %}{{ dummy.boundary_field }} {{ boundary_root }}{%+ endraw +%} kept {{ data['boundary_field'] }}
