[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zals"
version = "0.2.0" # x-release-please-version
description = "Zig Ansible Language Server"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [{ name = "kksat" }]
keywords = ["ansible", "lsp", "language-server", "zig"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kksat/zals"
Repository = "https://github.com/kksat/zals"
Changelog = "https://github.com/kksat/zals/blob/main/CHANGELOG.md"

[project.scripts]
zals = "zals._run:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]